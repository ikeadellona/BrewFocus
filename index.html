<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewFocus</title>
    <!-- connect to css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main app container -->
    <div class="app">

        <!-- App header -->
        <header>
            <h1>☕ BrewFocus</h1>
            <p>Good ideas take time.</p>
        </header>

        <!-- Drink selection section -->
        <section class="drink-menu">
            <h2>Choose Your Drink...</h2>

            <!-- Container for the four drinks -->
            <div class="drink-grid">

                <button class="drink-card" data-drink="Iced Coffee">
                    <span class="drink-icon">🧋</span>
                    <span>Iced Coffee</span>
                </button>

                <button class="drink-card" data-drink="Iced Matcha">
                    <span class="drink-icon">🍵</span>
                    <span>Iced Matcha</span>
                </button>

                <button class="drink-card" data-drink="Iced Thai Tea">
                    <span class="drink-icon">🥤</span>
                    <span>Iced Thai Tea</span>
                </button>

                <button class="drink-card" data-drink="Hot Tea">
                    <span class="drink-icon">🫖</span>
                    <span>Hot Tea</span>
                </button>

            </div>
            <p id="selected-drink">No drink selected yet.</p>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
