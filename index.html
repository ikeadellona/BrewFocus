<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewFocus</title>
    <!-- connect to css -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Main app container -->
    <div class="app">

        <!-- App header -->
        <header class="app-header">
            <h1>
                <a href="#" id="home-link">☕ BrewFocus</a>
            </h1>
            <p>GOOD IDEAS TAKE TIME</p>
        </header>

        <!-- screen 1 : Drink selection section -->
        <section id="drink-screen" class="drink-menu">

            <h2>Choose Your Drink...</h2>

            <!-- Container for the four drinks -->
            <div class="drink-grid">

                <button class="drink-card" data-drink="Iced Coffee">
                    <span class="drink-icon">🧋</span>
                    <span>Iced Coffee</span>
                </button>

                <button class="drink-card" data-drink="Iced Matcha">
                    <span class="drink-icon">🍵</span>
                    <span>Iced Matcha</span>
                </button>

                <button class="drink-card" data-drink="Iced Thai Tea">
                    <span class="drink-icon">🥤</span>
                    <span>Iced Thai Tea</span>
                </button>

                <button class="drink-card" data-drink="Hot Tea">
                    <span class="drink-icon">🫖</span>
                    <span>Hot Tea</span>
                </button>

            </div>
            <!-- <p id="selected-drink">No drink selected yet.</p> -->
        </section>

        <!-- Screen 2: Timer section -->
        <section id="timer-screen" class="timer-section hidden">

            <!-- <h2>Focus Timer</h2> -->

            <p id="session-label">Focus Session</p>

            <p id="timer-display">25:00</p>
                
            <div class="drink-container">
                <div class="liquid-mask">
                    <div id="liquid"></div>
                </div>
                <img src="images/ice-coffee.png" class="ice" alt="Iced coffee cubes">
                <img src="images/Icedcoffee-cup.png" class="cup" alt="Iced Coffee Cup">
            </div>
                
            <div class="timer-controls">
                <button id="toggle-btn">Start</button>
                <button id="reset-btn">Reset</button>
            </div>
            
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
